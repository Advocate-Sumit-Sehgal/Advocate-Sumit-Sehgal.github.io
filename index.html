<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sumit Sehgal | Advocate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Practical legal counsel for businesses and individuals. Contracts, compliance, dispute resolution." />
  <style>
    :root {
      --bg-dark: #111111;
      --bg-darker: #0a0a0a;
      --text-light: #f5f5f5;
      --text-mid: #bbbbbb;
      --accent: #c9a552; /* muted gold */
      --border-light: rgba(255,255,255,0.12);
      --border-dark: #e2e2e2;
      --body-max: 1100px;
      --body-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      font-family: var(--body-font);
      line-height: 1.5;
      color: #111;
      background-color: #ffffff;
    }

    /* ===== TOP CONTACT BAR ===== */
    .top-bar {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-size: 13px;
      padding: 8px 16px;
    }

    .top-bar-inner {
      max-width: var(--body-max);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 16px;
    }

    .top-left,
    .top-right {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .top-item {
      color: var(--text-light);
    }

    .top-item span.label {
      color: var(--text-mid);
      font-weight: 500;
      margin-right: 4px;
    }

    /* ===== NAV BAR ===== */
    .nav-bar {
      background-color: #fff;
      border-bottom: 1px solid var(--border-dark);
      padding: 16px;
    }

    .nav-inner {
      max-width: var(--body-max);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #111;
    }

    .brand-tag {
      font-size: 13px;
      color: #555;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
      font-size: 14px;
      font-weight: 500;
      position: relative;
    }

    .nav-links > a {
      color: #111;
      text-decoration: none;
    }

    .nav-links > a:hover {
      color: var(--accent);
    }

    /* Dropdown container in nav */
    .practice-container {
      display: flex;
      flex-direction: column;
      position: relative;
      font-size: 14px;
      font-weight: 500;
    }

    .practice-trigger {
      text-decoration: none;
      color: #111;
      cursor: pointer;
    }

    .practice-trigger:hover {
      color: var(--accent);
    }

    .practice-dropdown {
      position: absolute;
      top: 22px;
      left: 0;
      background:#fff;
      border:1px solid var(--border-dark);
      border-radius:8px;
      padding:12px 16px;
      min-width:220px;
      box-shadow:0 12px 24px rgba(0,0,0,0.08);
      display:none;
      z-index:999;
      font-size:14px;
      line-height:1.4;
    }

    .practice-dropdown a {
      display:block;
      color:#111;
      text-decoration:none;
      font-weight:500;
      padding:4px 0;
    }

    .practice-dropdown a:hover {
      color:var(--accent);
    }

    /* ===== HERO SECTION ===== */
    .hero {
      position: relative;
      background-color: var(--bg-darker);
      color: var(--text-light);
      padding: 60px 16px 80px;
    }

    .hero-inner {
      max-width: var(--body-max);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 24px;
    }

    @media(min-width:768px){
      .hero-inner {
        grid-template-columns: 1fr 1fr;
        column-gap: 40px;
        align-items: center;
      }
    }

    .hero-copy h1 {
      font-size: clamp(28px, 2vw, 32px);
      font-weight: 600;
      color: var(--text-light);
      margin: 0 0 12px 0;
    }

    .hero-copy .subline {
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.5;
      max-width: 500px;
    }

    .hero-badge {
      display: inline-block;
      background-color: rgba(201,165,82,0.12); /* gold tint */
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 16px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .hero-cta-box {
      border: 1px solid var(--border-light);
      background-color: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-light);
      max-width: 360px;
    }

    .hero-cta-box .cta-label {
      color: var(--text-mid);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .hero-cta-box .cta-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-light);
    }

    .hero-cta-box .cta-accent {
      color: var(--accent);
      font-weight: 600;
